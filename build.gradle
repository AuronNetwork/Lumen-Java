plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = project.mod_version
group = 'net.auronnetwork.lumen'
base { archivesName = 'lumen-java' }

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Optional local compatibility fixtures, never embedded in the distributed JAR.
    if (providers.gradleProperty('shaderTestMods').isPresent()) {
        runtimeOnly fileTree(dir: providers.gradleProperty('shaderTestMods').get(), includes: ['iris-*.jar', 'sodium-*.jar'])
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
test { useJUnitPlatform() }
jar {
    from('LICENSE') { rename { 'LICENSE-Lumen' } }
    from('NOTICE.md') { rename { 'NOTICE-Lumen.md' } }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'lumen-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}

tasks.named('runClientGameTest') {
    if (providers.gradleProperty('shaderTestPack').isPresent()) {
        systemProperty 'lumen.test.shaderPack', providers.gradleProperty('shaderTestPack').get()
    }
}
