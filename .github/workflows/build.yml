name: Build Lumen Java for 26.2
on:
  push:
    branches: [support/mc-26.2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and test
        run: ./gradlew.bat build --no-daemon --console plain
      - name: Package mod and complete source
        run: python scripts/package.py
      - name: Retain release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lumen-Java
          path: |
            dist/*.jar
            dist/*-Source.zip
            dist/SHA256SUMS.txt
            dist/README.md
            dist/NOTICE.md
            dist/LICENSE
            dist/TESTING.md
          if-no-files-found: error
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lumen-Java-test-results
          path: build/test-results/test/*.xml
          if-no-files-found: ignore
